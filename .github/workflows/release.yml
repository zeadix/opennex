name: Release

on:
  push:
    tags:
      - 'v*'

env:
  R2_BUCKET: opennex-ci
  R2_PUBLIC_URL: https://opennex.download.zeadix.com

permissions:
  contents: write

jobs:
  build-tauri:
    # Tauri 客户端（opennex/tauri-app）三平台打包：NSIS+MSI / DMG / DEB+AppImage
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifacts: tauri-windows
          - os: macos-latest
            artifacts: tauri-macos
          - os: ubuntu-22.04
            artifacts: tauri-linux
          - os: ubuntu-22.04-arm
            artifacts: tauri-linux-arm64
          # 实验性:GitHub 公开仓库的 Windows ARM64 runner。工具链波动
          # 不得阻塞发版(失败时本腿跳过,x64 照常发布)。
          - os: windows-11-arm
            artifacts: tauri-windows-arm64
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    env:
      # minisign 私钥：tauri build 用它给更新器产物(.sig)签名；
      # 缺失时 tauri build 会直接失败（createUpdaterArtifacts: true）。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: tauri-app
        run: npm ci

      - name: Build frontend
        working-directory: tauri-app
        run: npm run build

      - name: Tauri build (Windows)
        if: runner.os == 'Windows'
        working-directory: tauri-app
        # ARM64 腿只打 NSIS(WiX/MSI 对 arm64 不可靠)
        run: npm run tauri -- build --bundles ${{ contains(matrix.os, 'arm') && 'nsis' || 'msi,nsis' }}

      - name: Tauri build (macOS)
        if: runner.os == 'macOS'
        working-directory: tauri-app
        # app 必须显式打出：createUpdaterArtifacts 只为 app 产物生成
        # .app.tar.gz + .sig（应用内更新器下载替换的包）；dmg 供官网直链
        run: npm run tauri -- build --bundles app,dmg

      - name: Tauri build (Linux)
        if: runner.os == 'Linux'
        working-directory: tauri-app
        run: npm run tauri -- build --bundles deb,appimage

      - name: Collect bundles + manifest
        shell: bash
        env:
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          mkdir -p bundles
          find tauri-app/src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} bundles/ \;
          # 更新器产物（createUpdaterArtifacts）：minisign .sig 签名 + macOS 的
          # .app.tar.gz（应用内更新器实际下载替换的包；DMG 只作官网直链下载）
          find tauri-app/src-tauri/target/release -type f \( -name "*.app.tar.gz" -o -name "*.sig" \) -not -path "*/deps/*" -exec cp {} bundles/ \;
          # Windows 便携版：裸 exe 解压即用（WebView2 由系统提供，与安装版一致）
          if [[ "$RUNNER_OS" == "Windows" && "$MATRIX_OS" != *arm* && -f tauri-app/src-tauri/target/release/opennex-tauri.exe ]]; then
            powershell -NoProfile -Command "Compress-Archive -Force -Path 'tauri-app/src-tauri/target/release/opennex-tauri.exe' -DestinationPath 'bundles/OpenNex_x64_portable.zip'"
          fi
          # 统一为无版本号的稳定文件名（版本在目录名里），官网直链永不失效
          cd bundles
          for f in *; do
            case "$f" in
              *x64-setup.exe) mv "$f" "OpenNex_x64-setup.exe" ;;
              *x64_en-US.msi) mv "$f" "OpenNex_x64_en-US.msi" ;;
              *x64-setup.exe.sig) mv "$f" "OpenNex_x64-setup.exe.sig" ;;
              *x64_en-US.msi.sig) mv "$f" "OpenNex_x64_en-US.msi.sig" ;;
              *aarch64.dmg)   mv "$f" "OpenNex_aarch64.dmg" ;;
              *.app.tar.gz.sig) mv "$f" "OpenNex.app.tar.gz.sig" ;;
              *.app.tar.gz)   mv "$f" "OpenNex.app.tar.gz" ;;
              *amd64.deb)     mv "$f" "OpenNex_amd64.deb" ;;
              *amd64.deb.sig) mv "$f" "OpenNex_amd64.deb.sig" ;;
              *amd64.AppImage) mv "$f" "OpenNex_amd64.AppImage" ;;
              *amd64.AppImage.sig) mv "$f" "OpenNex_amd64.AppImage.sig" ;;
              *arm64-setup.exe) mv "$f" "OpenNex_arm64-setup.exe" ;;
              *arm64-setup.exe.sig) mv "$f" "OpenNex_arm64-setup.exe.sig" ;;
              *arm64.deb) mv "$f" "OpenNex_aarch64.deb" ;;
              *arm64.deb.sig) mv "$f" "OpenNex_aarch64.deb.sig" ;;
              *aarch64.AppImage) mv "$f" "OpenNex_aarch64.AppImage" ;;
              *aarch64.AppImage.sig) mv "$f" "OpenNex_aarch64.AppImage.sig" ;;
            esac
          done
          python3 << 'PYMANIFEST'
          import hashlib, json, glob, os
          base = os.environ['R2_PUBLIC_URL'].rstrip('/') + '/tauri/latest'
          out = {'windows': {}, 'macos': {}, 'linux': {}}
          filemap = {
              'OpenNex_x64-setup.exe': ('windows', 'installer'),
              'OpenNex_x64_en-US.msi': ('windows', 'msi'),
              'OpenNex_x64_portable.zip': ('windows', 'portable'),
              'OpenNex_arm64-setup.exe': ('windows', 'installer_arm64'),
              'OpenNex_aarch64.dmg': ('macos', 'dmg'),
              'OpenNex_amd64.deb': ('linux', 'deb'),
              'OpenNex_amd64.AppImage': ('linux', 'appimage'),
              'OpenNex_aarch64.deb': ('linux', 'deb_arm64'),
              'OpenNex_aarch64.AppImage': ('linux', 'appimage_arm64'),
          }
          for f in sorted(glob.glob('*')):
              kind = filemap.get(f)
              if not kind: continue
              os_name, key = kind
              sha = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              out[os_name][key] = {'url': base + '/' + f, 'sha256': sha}
          json.dump(out, open('tauri-files.json', 'w'), indent=1)
          # 应用内更新源清单：平台键 -> {url, signature}（minisign 签名正文）。
          # publish 侧把三平台合并成 tauri/latest.json 给 tauri-plugin-updater。
          # 平台键必须带安装方式后缀（{os}-{arch}-{installer}）：
          # 插件先查精确键再回退 {os}-{arch}；deb 安装的应用若回退命中
          # AppImage 条目，会报 "invalid updater binary format"（v0.1.59）。
          # deb/rpm 安装的一键更新由插件 pkexec/sudo 提权后 dpkg -i 完成。
          def upd_entry(binary, sig):
              if os.path.exists(binary) and os.path.exists(sig):
                  return {'url': base + '/' + binary,
                          'signature': open(sig, encoding='utf-8').read().strip()}
              return None
          upd = {}
          for platform_key, (binary, sig) in {
              'windows-x86_64-nsis': ('OpenNex_x64-setup.exe', 'OpenNex_x64-setup.exe.sig'),
              'windows-x86_64-msi': ('OpenNex_x64_en-US.msi', 'OpenNex_x64_en-US.msi.sig'),
              'windows-aarch64-nsis': ('OpenNex_arm64-setup.exe', 'OpenNex_arm64-setup.exe.sig'),
              'darwin-aarch64-app': ('OpenNex.app.tar.gz', 'OpenNex.app.tar.gz.sig'),
              'linux-x86_64-appimage': ('OpenNex_amd64.AppImage', 'OpenNex_amd64.AppImage.sig'),
              'linux-x86_64-deb': ('OpenNex_amd64.deb', 'OpenNex_amd64.deb.sig'),
              'linux-aarch64-appimage': ('OpenNex_aarch64.AppImage', 'OpenNex_aarch64.AppImage.sig'),
              'linux-aarch64-deb': ('OpenNex_aarch64.deb', 'OpenNex_aarch64.deb.sig'),
          }.items():
              entry = upd_entry(binary, sig)
              if entry: upd[platform_key] = entry
          json.dump(upd, open('tauri-updater.json', 'w'), indent=1)
          print('updater platforms:', sorted(upd))
          PYMANIFEST
          cat tauri-files.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifacts }}
          path: bundles/

  publish:
    runs-on: ubuntu-latest
    needs: [build-tauri]
    steps:
      - uses: actions/checkout@v4
        # FULL history + ALL tags. The default shallow checkout fetches
        # ONLY the pushed tag ref — `git tag` on the runner then sees a
        # single (or zero) tag, so PREV_TAG resolved to empty on EVERY
        # release: RAW_SUBJECTS degraded to "首次发布" and the changes
        # array shipped EMPTY (v0.1.52/53/54 all affected). The tag
        # annotation reader is equally dependent on the tag objects.
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download Tauri artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: artifacts/tauri-windows

      - name: Download Tauri artifacts (macOS)
        uses: actions/download-artifact@v4
        with:
          name: tauri-macos
          path: artifacts/tauri-macos

      - name: Download Tauri artifacts (Linux)
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: artifacts/tauri-linux

      - name: Download Tauri artifacts (Linux ARM64)
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux-arm64
          path: artifacts/tauri-linux-arm64

      - name: Download Tauri artifacts (Windows ARM64)
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows-arm64
          path: artifacts/tauri-windows-arm64
        continue-on-error: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Merge Tauri manifests
        run: |
          python3 << 'PYMERGE'
          import json, glob
          merged = {'windows': {}, 'macos': {}, 'linux': {}}
          for f in glob.glob('artifacts/tauri-*/**/tauri-files.json', recursive=True):
              d = json.load(open(f))
              for k, v in d.items(): merged[k].update(v)
          json.dump(merged, open('tauri-files.json', 'w'))
          # 应用内更新源：合并三平台的 {平台键: {url, signature}}
          merged_upd = {}
          for f in glob.glob('artifacts/tauri-*/**/tauri-updater.json', recursive=True):
              merged_upd.update(json.load(open(f)))
          json.dump(merged_upd, open('tauri-updater.json', 'w'), indent=1)
          print('updater platforms:', sorted(merged_upd))
          PYMERGE

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd artifacts
          for dir in tauri-windows tauri-macos tauri-linux tauri-windows-arm64 tauri-linux-arm64; do
            # 镜像到固定别名目录（官网/更新器直链不随版本变化）
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              wrangler r2 object put "${{ env.R2_BUCKET }}/tauri/latest/${filename}" --file="$file" --remote
            done
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              echo "Uploading $filename to R2..."
              wrangler r2 object put "${{ env.R2_BUCKET }}/${VERSION}/${filename}" --file="$file" --remote
            done
          done

      - name: Generate changelog from git history
        id: changelog
        shell: bash
        env:
          # runner locale must never break python's text decoding of the
          # UTF-8 tag annotations / commit subjects.
          PYTHONUTF8: "1"
        run: |
          # Re-fetch tag OBJECTS: actions/checkout delivers the pushed
          # tag peeled to its commit (cat-file -t says "commit"), which
          # destroys the annotation read below. --force overwrites the
          # refs so the annotated objects are local for real.
          git fetch --tags --force origin 2>/dev/null || true
          # grep exits 1 when no other tags exist (first release); guard it.
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${GITHUB_REF_NAME}" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            # sed 消费整个流(而不是 head 提前关管道): 提交数 >30 时
            # git log 会收到 SIGPIPE,pipefail 下整步 141 退出。
            RAW_SUBJECTS=$(git log --no-merges --pretty=format:'%s' "$PREV_TAG..${GITHUB_REF_NAME}" | sed -n '1,30p')
          else
            RAW_SUBJECTS="首次发布"
          fi
          {
            echo "changelog<<EOF"
            echo "$RAW_SUBJECTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Structured changes array: ONLY user-facing work is
          # recorded — feat commits map to "新增: ...", fix commits to
          # "修复: ...". Everything else (ci/chore/docs/refactor and the
          # CI-repair commits created by failed-release retries) is
          # deliberately EXCLUDED. Deduplicated, one concise line each.
          # A tag ANNOTATION message overrides the commit-derived list
          # (write the release notes by hand into the tag when precision
          # matters; non-feature/fix lines in it are dropped too).
          python3 - "$GITHUB_REF_NAME" << PYCHANGES
          import json, os, subprocess, sys, re
          tag = sys.argv[1]
          # Prefer the tag annotation message (first non-blank lines).
          # Read the RAW tag object via cat-file and parse the message
          # (everything after the first blank line) ourselves: the
          # %(contents:subject) atom proved unreliable on runner git
          # (returned the dereferenced COMMIT subject instead of the
          # annotation, which silently emptied the changes array).
          msg = ""
          try:
              raw_obj = subprocess.run(
                  ["git", "cat-file", "-p", tag],
                  capture_output=True, text=True).stdout or ""
              if raw_obj.startswith("object "):
                  # annotated tag: message starts after the header block
                  parts = raw_obj.split("\n\n", 1)
                  msg = parts[1].strip() if len(parts) > 1 else ""
              else:
                  # lightweight: the object IS the commit — no curated
                  # notes; fall through to commit subjects below.
                  msg = ""
          except Exception:
              msg = ""
          # Match feat/fix (optionally with a scope), but reject ENGINEERING
          # scopes: feat(ci) / feat(deps) are not user-facing work.
          # feat(ui) / fix(ssh) still count (scope = feature area).
          ENGINEERING_SCOPES = r"(?:ci|deps|build|chore|docs|refactor|style|test|perf|release)"
          RE_FEAT = re.compile(r"^feat(?:\((?!ENG)(?P<scope>[^)]*)\))?:(?P<rest>.*)$".replace("ENG", ENGINEERING_SCOPES), re.I)
          RE_FIX = re.compile(r"^fix(?:\((?!ENG)(?P<scope>[^)]*)\))?:(?P<rest>.*)$".replace("ENG", ENGINEERING_SCOPES), re.I)
          def split_bilingual(line):
              # Annotation lines carry BOTH languages: "修复: xxx | Fix: xxx".
              # Returns (zh, en) with either side optional; lines without
              # a separator are treated as zh-only (en falls back to the
              # zh text on the website side).
              if " | " in line:
                  zh, en = line.split(" | ", 1)
                  return zh.strip(), en.strip()
              return line, ""
          def map_line(l):
              l = l.strip()
              if not l:
                  return None, None
              zh_part, en_part = split_bilingual(l)
              low = zh_part.lower()
              zh = None
              if low.startswith("新增") or low.startswith("修复"):
                  zh = zh_part
              for kind, rx in (("新增", RE_FEAT), ("修复", RE_FIX)):
                  m = rx.match(zh_part)
                  if m:
                      zh = kind + ": " + m.group("rest").strip()
                      break
              if zh is None:
                  return None, None  # ci/chore/docs/refactor/release — never recorded
              # English side: prefer the annotation's en half (already
              # carries "Fix:"/"Add:" or plain text); on commit-subject
              # fallback the raw subject IS English — strip any scope.
              en = en_part if en_part else None
              if not en and not msg:
                  # commit subject: re-run the fix/feat regex for the EN half
                  for kind, rx in (("Fix", RE_FIX), ("Add", RE_FEAT)):
                      m = rx.match(zh_part)
                      if m:
                          en = kind + ": " + m.group("rest").strip()
                          break
              return zh, en

          zh_lines = []
          en_lines = []
          raw = ""
          if msg:
              for l in msg.splitlines():
                  if not l.strip() or l.startswith("-----BEGIN"):
                      continue
                  zh, en = map_line(l)
                  if zh:
                      zh_lines.append(zh)
                      en_lines.append(en)
          else:
              raw = """$RAW_SUBJECTS"""
              for l in raw.splitlines():
                  zh, en = map_line(l)
                  if zh:
                      zh_lines.append(zh)
                      en_lines.append(en)
          # Deduplicate (both languages in lockstep), keep order, cap 30.
          seen = set()
          out = []
          out_en = []
          for zh, en in zip(zh_lines, en_lines):
              if zh not in seen:
                  seen.add(zh)
                  out.append(zh)
                  out_en.append(en if en else "")
          # Write BOTH arrays straight to $GITHUB_OUTPUT (a multi-line
          # heredoc can only carry one value per GITHUB_OUTPUT entry).
          gh_out = os.environ.get("GITHUB_OUTPUT", "")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write("changes_json<<EOF\n")
                  f.write(json.dumps(out[:10], ensure_ascii=False) + "\nEOF\n")
                  f.write("changes_en_json<<EOF\n")
                  f.write(json.dumps(out_en[:10], ensure_ascii=False) + "\nEOF\n")
          print(json.dumps(out[:10], ensure_ascii=False))
          print(json.dumps(out_en[:10], ensure_ascii=False))
          # Diagnostics: the extraction shipped [] for many releases and
          # the runner environment was the only untested variable. These
          # lines land in the step log (stderr) and make every future
          # empty-changes mystery a 10-second read.
          tag_count = subprocess.run(["git", "tag", "-l"], capture_output=True, text=True).stdout.count("\n")
          obj_type = subprocess.run(["git", "cat-file", "-t", tag], capture_output=True, text=True).stdout.strip()
          sys.stderr.write(
              "DIAG tag_count=" + str(tag_count)
              + " obj_type=" + obj_type
              + " msg_len=" + str(len(msg))
              + " msg_repr=" + repr(msg[:200])
              + " lines=" + str(len(out)) + "\n")
          PYCHANGES

      - name: Generate GitHub Release body
        id: release_body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGES_JSON: ${{ steps.changelog.outputs.changes_json }}
        run: |
          # Human-readable release notes for the GitHub Release page —
          # SAME source as the client's update window and the website
          # (the changes array), so all three surfaces tell the same
          # story. The old generate_release_notes mode showed GitHub's
          # raw commit list, which read like engineering noise, not
          # software update notes.
          mkdir -p deploy
          python3 << PYRELEASE
          import json, os
          version = os.environ.get("VERSION", "v0.0.0")
          try:
              changes = json.loads(os.environ.get("CHANGES_JSON", "[]"))
          except Exception:
              changes = []
          feats = [c for c in changes if c.startswith("新增:")]
          fixes = [c for c in changes if c.startswith("修复:")]
          lines = [f"# OpenNex {version}", ""]
          if feats:
              lines.append("## 新增")
              lines.extend(f"- {c[3:].strip()}" for c in feats)
              lines.append("")
          if fixes:
              lines.append("## 修复")
              lines.extend(f"- {c[3:].strip()}" for c in fixes)
              lines.append("")
          if not feats and not fixes:
              lines.append("稳定性与内部工程改进。")
              lines.append("")
          body = "\n".join(lines).rstrip() + "\n"
          with open("deploy/release_body.md", "w") as f:
              f.write(body)
          print(body)
          PYRELEASE
          echo "release_body_path=deploy/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json with version history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGES_JSON: ${{ steps.changelog.outputs.changes_json }}
          CHANGES_EN_JSON: ${{ steps.changelog.outputs.changes_en_json }}
          PYTHONUTF8: "1"
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
        run: |
          mkdir -p deploy
          VERSION_NUM=$(echo "$VERSION" | sed 's/^v//')
          DATE=$(date -u +%Y-%m-%d)

          # Build current version entry as JSON — written straight to a
          # file (no bash variable round-trip)
          cat > /tmp/current_entry.json << CURRENTEOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "files": {}
          }
          CURRENTEOF

          # Try to download old latest.json
          if ! wrangler r2 object get "${R2_BUCKET}/latest.json" --file=/tmp/old_latest.json --remote 2>/dev/null; then
            echo "[]" > /tmp/old_latest.json
          fi

          # Build new latest.json with history using Python. The data
          # crosses via FILES, never via bash variable interpolation:
          # ${VAR} inside an unquoted heredoc mangles JSON (bare control
          # characters -> "Invalid control character"). strict=False
          # tolerates any stray control characters in legacy entries.
          python3 << PYEOF
          import json, os, re, subprocess

          current = json.load(open("/tmp/current_entry.json"))
          current["changelog"] = os.environ.get("CHANGELOG", "")
          # Tauri 客户端产物（三平台安装包）并入 latest.json，供官网下载页展示
          try:
              current["tauri"] = json.load(open("tauri-files.json"))
          except Exception:
              pass
          try:
              current["changes"] = json.loads(os.environ.get("CHANGES_JSON", "[]"))
          except Exception:
              current["changes"] = []
          try:
              current["changes_en"] = json.loads(os.environ.get("CHANGES_EN_JSON", "[]"))
          except Exception:
              current["changes_en"] = []
          try:
              old_latest = json.load(open("/tmp/old_latest.json"), strict=False)
              old_history = old_latest.get("history", []) if isinstance(old_latest, dict) else []
          except Exception:
              old_history = []

          # Shared extractor: feat/fix (optionally scoped) -> 新增/修复.
          # ENGINEERING scopes (feat(ci)/feat(deps)/fix(release)/...) are
          # NOT user-facing work and never recorded.
          ENGINEERING_SCOPES = "(?:ci|deps|build|chore|docs|refactor|style|test|perf|release)"
          RE_FEAT = re.compile(r"^feat(?:\((?!(?:" + ENGINEERING_SCOPES + r")\))(?P<scope>[^)]*)\))?:(?P<rest>.*)$", re.I)
          RE_FIX = re.compile(r"^fix(?:\((?!(?:" + ENGINEERING_SCOPES + r")\))(?P<scope>[^)]*)\))?:(?P<rest>.*)$", re.I)

          def split_bilingual(line):
              # Annotation lines carry BOTH languages: "修复: xxx | Fix: xxx".
              # Returns (zh, en); without a separator the line is zh-only.
              if " | " in line:
                  zh, en = line.split(" | ", 1)
                  return zh.strip(), en.strip()
              return line, ""
          def map_note(l):
              l = l.strip()
              if not l:
                  return None, None
              zh_part, en_part = split_bilingual(l)
              low = zh_part.lower()
              zh = None
              if low.startswith("新增") or low.startswith("修复"):
                  zh = zh_part
              for kind, rx in (("新增", RE_FEAT), ("修复", RE_FIX)):
                  m = rx.match(zh_part)
                  if m:
                      zh = kind + ": " + m.group("rest").strip()
                      break
              if zh is None:
                  return None, None
              en = en_part or ""
              return zh, en
          def extract_both(notes):
              zh, en = [], []
              for l in notes.splitlines():
                  z, e = map_note(l)
                  if z:
                      zh.append(z)
                      en.append(e)
              return zh, en

          def tag_notes(tag):
              # Raw object parse (see the changelog step): the
              # %(contents:...) atoms dereferenced annotated tags on the
              # runner, yielding the COMMIT message instead of the
              # curated annotation. cat-file + header split is exact.
              try:
                  raw_obj = subprocess.run(
                      ["git", "cat-file", "-p", tag],
                      capture_output=True, text=True).stdout or ""
                  if not raw_obj.startswith("object "):
                      return ""
                  parts = raw_obj.split("\n\n", 1)
                  return parts[1].strip() if len(parts) > 1 else ""
              except Exception:
                  return ""

          # Retro-fix HISTORY entries: legacy entries shipped EMPTY
          # changes (the old shallow checkout had no tags on the runner,
          # so every extraction degraded to 首次发布). The tag
          # ANNOTATION is the authoritative source and overrides even
          # non-empty entries (a re-annotated tag upgrades legacy notes
          # to curated bilingual ones); when a tag has no usable notes,
          # fall back to git-log feat/fix subjects between this tag and
          # the OLDER history neighbor.
          for idx, h in enumerate(old_history):
              if h.get("changes"):
                  # No annotation for this tag (lightweight, or the
                  # curated notes map to nothing) — keep existing notes,
                  # just strip legacy noise; en side stays as-is if it
                  # ever gained one.
                  ver = h.get("version", "")
                  tag = "v" + ver
                  notes = tag_notes(tag)
                  extracted, extracted_en = extract_both(notes) if notes.strip() else ([], [])
                  if extracted:
                      h["changes"] = extracted
                      h["changes_en"] = extracted_en
                  else:
                      h["changes"] = [l for l in h["changes"]
                                      if not l.strip().startswith("其他:")]
                  continue
              ver = h.get("version", "")
              tag = "v" + ver
              # Lightweight tags mirror the commit message here, so their
              # "annotation" read yields e.g. "release: v0.1.53" which
              # maps to NOTHING — an empty extraction must fall through
              # to the git-log range, not stop.
              notes = tag_notes(tag)
              extracted, extracted_en = extract_both(notes) if notes.strip() else ([], [])
              if not extracted:
                  prev = old_history[idx + 1].get("version") if idx + 1 < len(old_history) else ""
                  rng = ("v" + prev + ".." + tag) if prev else tag
                  try:
                      notes = subprocess.run(
                          ["git", "log", "--no-merges", "--pretty=%s", rng],
                          capture_output=True, text=True).stdout or ""
                  except Exception:
                      notes = ""
                  extracted, extracted_en = extract_both(notes)
              h["changes"] = extracted
              h["changes_en"] = extracted_en

          # Build new history: current version first, then old ones, max 3
          # Re-tagging a version stacks DUPLICATE entries in old_history
          # (0.1.54 x3 after the re-releases) — dedupe by version, newest
          # first, before appending. Entries matching the CURRENT version
          # are dropped outright: current already carries the fresh notes.
          seen_versions = set()
          deduped = []
          for h in old_history:
              v = h.get("version")
              if v and v not in seen_versions and v != current.get("version"):
                  seen_versions.add(v)
                  deduped.append(h)
          old_history = deduped
          new_history = [current] + old_history
          # Top up: history entries that were pushed out by the empty-
          # changes era are rebuilt from git tags (annotation notes, then
          # feat/fix log subjects between tag ranges) so the website's
          # "version update record" always shows the last 3 releases
          # with real notes. files stay empty for rebuilt entries — the
          # R2 assets for those versions are gone; the download-list
          # footer already routes users to GitHub Releases for them.
          have = set(h["version"] for h in new_history)
          if len(new_history) < 3:
              all_tags = [t for t in (subprocess.run(
                  ["git", "tag", "--sort=-v:refname"],
                  capture_output=True, text=True).stdout or "").split()
                  if t.startswith("v")]
              for t in all_tags:
                  if len(new_history) >= 3:
                      break
                  v = t[1:]
                  if v in have:
                      continue
                  notes = tag_notes(t)
                  changes, changes_en = extract_both(notes)
                  if not changes:
                      prev_tag = all_tags[all_tags.index(t) + 1] if all_tags.index(t) + 1 < len(all_tags) else ""
                      rng = (prev_tag + ".." + t) if prev_tag else t
                      try:
                          log_out = subprocess.run(
                              ["git", "log", "--no-merges", "--pretty=%s", rng],
                              capture_output=True, text=True).stdout or ""
                      except Exception:
                          log_out = ""
                      changes, changes_en = extract_both(log_out)
                  try:
                      date = subprocess.run(
                          ["git", "log", "-1", "--pretty=%cI", t],
                          capture_output=True, text=True).stdout.strip()[:10]
                  except Exception:
                      date = ""
                  new_history.append({"version": v, "date": date, "files": {},
                                      "changelog": "", "changes": changes,
                                      "changes_en": changes_en})
                  have.add(v)
          new_history = new_history[:3]

          # Find versions to delete (beyond the 3 kept)
          kept_versions = set(h["version"] for h in new_history)
          all_old_versions = set(h["version"] for h in old_history)
          to_delete = all_old_versions - kept_versions

          # Also add current to old version list for deletion check
          # (current version won't be in old list, so no issue)

          latest = {
              "version": current["version"],
              "date": current["date"],
              "files": current["files"],
              "changes": current["changes"],
              "changes_en": current["changes_en"],
              "history": new_history
          }

          with open("deploy/latest.json", "w") as f:
              json.dump(latest, f, indent=2)

          # Write versions to delete to a file for the next step
          with open("/tmp/versions_to_delete.txt", "w") as f:
              for v in to_delete:
                  f.write(v + "\n")

          print("=== latest.json ===")
          print(json.dumps(latest, indent=2))

          if to_delete:
              print("\n=== Versions to delete from R2 ===")
              for v in to_delete:
                  print(f"  v{v}")
          PYEOF

      - name: Clean up old R2 versions
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
        run: |
          if [ -f /tmp/versions_to_delete.txt ]; then
            while IFS= read -r version; do
              [ -z "$version" ] && continue
              echo "Deleting old version v${version} from R2..."
              # List objects in the version directory
              OBJECTS=$(wrangler r2 object list "${R2_BUCKET}/v${version}/" --remote 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for obj in data:
                  print(obj['key'])
          except:
              pass
          " 2>/dev/null || echo "")
              for obj_key in $OBJECTS; do
                echo "  Deleting $obj_key..."
                wrangler r2 object delete "${R2_BUCKET}/${obj_key}" --remote 2>/dev/null || true
              done
            done < /tmp/versions_to_delete.txt
          fi

      - name: Upload latest.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put "${{ env.R2_BUCKET }}/latest.json" --file=deploy/latest.json --remote --content-type="application/json"

      - name: Build + upload Tauri updater feed (tauri/latest.json)
        # tauri-plugin-updater 的静态更新源：应用内「一键更新」查这个文件。
        # platforms 由三平台的 minisign 签名产物合并而来（tauri-updater.json）；
        # 私钥签名在构建期完成，这里只组装 version/notes/pub_date/platforms。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGES_JSON: ${{ steps.changelog.outputs.changes_json }}
          CHANGES_EN_JSON: ${{ steps.changelog.outputs.changes_en_json }}
          PYTHONUTF8: "1"
        run: |
          mkdir -p deploy
          python3 << 'PYFEED'
          import json, os
          from datetime import datetime, timezone
          version = os.environ.get("VERSION", "").lstrip("v")
          try:
              platforms = json.load(open("tauri-updater.json"))
          except Exception:
              platforms = {}
          if not platforms:
              raise SystemExit("::error::tauri-updater.json missing/empty — no signed updater artifacts were collected")
          def env_changes(name):
              try:
                  return json.loads(os.environ.get(name, "[]") or "[]")
              except Exception:
                  return []
          zh = env_changes("CHANGES_JSON")
          en = [e for e in env_changes("CHANGES_EN_JSON") if e]
          notes = "\n".join(zh + ([""] + en if en else [])) or "稳定性与内部工程改进。"
          feed = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(feed, open("deploy/tauri-latest.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(feed, indent=2, ensure_ascii=False))
          PYFEED
          wrangler r2 object put "${{ env.R2_BUCKET }}/tauri/latest.json" --file=deploy/tauri-latest.json --remote --content-type="application/json"

      - name: Create GitHub Release (gh CLI, sequential uploads)
        # softprops/action-gh-release 并发上传后逐资产 PATCH 元数据,撞上
        # GitHub 的最终一致性延迟就是 404,整步标红(v0.1.59/60 两次)。
        # gh release 顺序上传 + 显式 enforce body,行为完全可控;重跑时
        # release 已存在则 --clobber 覆盖资产(幂等)。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # CI 内部清单在各平台目录同名（tauri-files.json/tauri-updater.json
          # ×3），作 Release 资产必然重名（422/404，v0.1.60 三连败根因）——
          # 信息已进 feed 与 latest.json，上传前删除。
          rm -f artifacts/tauri-*/tauri-files.json artifacts/tauri-*/tauri-updater.json 2>/dev/null || true
          ls artifacts/tauri-windows artifacts/tauri-macos artifacts/tauri-linux
          if gh release view "$VERSION" --repo zeadix/opennex >/dev/null 2>&1; then
            echo "release exists — replacing assets (--clobber)"
            gh release upload "$VERSION" --repo zeadix/opennex --clobber \
              artifacts/tauri-windows/* artifacts/tauri-macos/* artifacts/tauri-linux/* artifacts/tauri-windows-arm64/* artifacts/tauri-linux-arm64/*
          else
            gh release create "$VERSION" --repo zeadix/opennex \
              --title "OpenNex $VERSION" \
              --notes-file deploy/release_body.md \
              artifacts/tauri-windows/* artifacts/tauri-macos/* artifacts/tauri-linux/* artifacts/tauri-windows-arm64/* artifacts/tauri-linux-arm64/*
          fi
          # 重发/复用 release 时 softprops/gh create 都不覆盖 body——
          # edit 永远落到最新 curated notes。
          gh release edit "$VERSION" --repo zeadix/opennex \
            --title "OpenNex $VERSION" --notes-file deploy/release_body.md
          echo "release + assets + body ready."

      - name: Trigger website rebuild
        if: success()
        # Hook failures (bad URL, secret missing, CF hiccup) must never fail
        # the release: artifacts and latest.json are already published.
        continue-on-error: true
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CF_DEPLOY_HOOK_URL not configured — skipping website rebuild trigger."
            exit 0
          fi
          # Wait for latest.json to propagate on R2/CDN before the website
          # build fetches it.
          sleep 30
          curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "Website rebuild triggered."

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  R2_BUCKET: opennex-ci
  R2_PUBLIC_URL: https://opennex.download.zeadix.com

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Add MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: cargo build --release

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create portable zip
        shell: bash
        run: |
          7z a "opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip" "./target/release/opennex.exe"

      - name: Install WiX Toolset
        shell: bash
        run: |
          # The third-party WixToolset-Action was deleted from GitHub
          # (repository not found), so install WiX 3.14 directly from the
          # official wixtoolset releases archive.
          set -euxo pipefail
          mkdir -p wixbin
          # wix314-binaries.zip contains candle.exe + light.exe (no wix.exe).
          curl -sSL -o wix314.zip \
            "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          unzip -o wix314.zip -d wixbin >/dev/null
          test -f wixbin/candle.exe && test -f wixbin/light.exe
          echo "$PWD/wixbin" >> $GITHUB_PATH
          for f in candle light; do command -v $f >/dev/null 2>&1 || { echo "::error::$f not found in PATH"; exit 1; }; done

      - name: Lint WiX sources
        shell: bash
        run: python3 scripts/lint_wix.py wix/main.wxs

      - name: Build MSI installer
        id: msi
        shell: bash
        run: |
          if [ ! -f wix/main.wxs ]; then
            echo "::error::wix/main.wxs missing — MSI cannot be built without the template."
            exit 1
          fi
          for f in candle light; do command -v $f >/dev/null 2>&1 || { echo "::error::$f not found in PATH"; exit 1; }; done
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          candle -ext WixUIExtension -out "opennex-${GITHUB_REF_NAME}-windows-x86_64.wixobj" wix/main.wxs -dSourcePath="$(pwd)/target/release/opennex.exe" -dVersion="$VERSION_NUM"
          light -ext WixUIExtension -cultures:en-US \
            -out "opennex-${GITHUB_REF_NAME}-windows-x86_64.msi" \
            "opennex-${GITHUB_REF_NAME}-windows-x86_64.wixobj"

      - name: Compute SHA256
        shell: bash
        run: |
          ls -la *.zip *.msi 2>/dev/null || true
          if [ -f "opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip" ]; then
            sha256sum "opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip" | awk '{print $1}' > windows-zip.sha256
          else
            echo "ERROR: zip file not found!" && exit 1
          fi
          if [ -f "opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.msi" ]; then
            sha256sum "opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.msi" | awk '{print $1}' > windows-msi.sha256
          else
            echo "::error::msi file not generated — MSI is a required release artifact."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip
            opennex-${{ steps.version.outputs.VERSION }}-windows-x86_64.msi
            windows-zip.sha256
            windows-msi.sha256

  build-macos:
    # NOTE: GitHub retired the macos-13 (Intel) runners — queued jobs on
    # them never start. All historical "x86_64" macOS artifacts were in
    # fact ARM builds mislabeled, so nothing is lost by going aarch64-only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create portable tar.gz
        run: |
          cd target/release
          tar czf "../../opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.tar.gz" opennex

      - name: Install cargo-bundle
        id: install_bundle
        continue-on-error: true
        # Pin the version and never fail the release: the DMG is optional
        # (tar.gz is the primary artifact). A transient crates.io index
        # breakage in cargo-bundle's dep tree (arrayref -> proc-macro1)
        # must not kill the whole macOS build.
        run: cargo install cargo-bundle --version 0.11.1

      - name: Create app bundle
        id: bundle
        continue-on-error: true
        if: steps.install_bundle.outcome == 'success'
        run: cargo bundle --release

      - name: Create DMG installer
        id: dmg
        continue-on-error: true
        if: steps.bundle.outcome == 'success'
        run: |
          hdiutil create \
            "opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.dmg" \
            -srcfolder target/release/bundle/osx/OpenNex.app \
            -ov -fs HFS+

      - name: Compute SHA256
        run: |
          shasum -a 256 "opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.tar.gz" | awk '{print $1}' > macos-tar.sha256
          if [ -f "opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.dmg" ]; then
            shasum -a 256 "opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.dmg" | awk '{print $1}' > macos-dmg.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.arch }}
          path: |
            opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.tar.gz
            opennex-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.dmg
            macos-tar.sha256
            macos-dmg.sha256

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create portable tar.gz
        run: |
          cd target/release
          tar czf "../../opennex-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz" opennex

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB package
        run: |
          cargo deb --output "opennex-${{ steps.version.outputs.VERSION }}-linux-amd64.deb"

      - name: Compute SHA256
        run: |
          sha256sum "opennex-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz" | awk '{print $1}' > linux-tar.sha256
          sha256sum "opennex-${{ steps.version.outputs.VERSION }}-linux-amd64.deb" | awk '{print $1}' > linux-deb.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            opennex-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            opennex-${{ steps.version.outputs.VERSION }}-linux-amd64.deb
            linux-tar.sha256
            linux-deb.sha256

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download macOS artifacts (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: macos-build-aarch64
          path: artifacts/macos-aarch64

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd artifacts
          for dir in windows macos-aarch64 linux; do
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              echo "Uploading $filename to R2..."
              wrangler r2 object put "${{ env.R2_BUCKET }}/${VERSION}/${filename}" --file="$file" --remote
            done
          done

      - name: Generate changelog from git history
        id: changelog
        shell: bash
        run: |
          # grep exits 1 when no other tags exist (first release); guard it.
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${GITHUB_REF_NAME}" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            RAW_SUBJECTS=$(git log --no-merges --pretty=format:'%s' "$PREV_TAG..${GITHUB_REF_NAME}" | head -30)
          else
            RAW_SUBJECTS="首次发布"
          fi
          {
            echo "changelog<<EOF"
            echo "$RAW_SUBJECTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Structured `changes` array: ONLY user-facing work is
          # recorded — feat commits map to "新增: ...", fix commits to
          # "修复: ...". Everything else (ci/chore/docs/refactor and the
          # CI-repair commits created by failed-release retries) is
          # deliberately EXCLUDED. Deduplicated, one concise line each.
          # A tag ANNOTATION message overrides the commit-derived list
          # (write the release notes by hand into the tag when precision
          # matters; non-feature/fix lines in it are dropped too).
          {
            echo "changes_json<<EOF"
            python3 - "$GITHUB_REF_NAME" << PYCHANGES
          import json, subprocess, sys
          tag = sys.argv[1]
          # Prefer the tag annotation message (first non-blank lines).
          msg = ""
          try:
              msg = subprocess.run(["git", "tag", "-l", "--format=%(contents:body)", tag],
                                   capture_output=True, text=True).stdout.strip()
          except Exception:
              pass
          def map_line(l):
              l = l.strip()
              if not l:
                  return None
              low = l.lower()
              for prefix, kind in (("feat", "新增"), ("fix", "修复")):
                  if low.startswith(prefix) or l.startswith(kind):
                      return kind + ": " + (l.split(":", 1)[1].strip() if ":" in l else l)
              return None  # ci/chore/docs/refactor/release — never recorded

          lines = []
          if msg:
              lines = [m for m in (map_line(l) for l in msg.splitlines()
                                   if l.strip() and not l.startswith("-----BEGIN"))
                       if m]
          else:
              raw = """$RAW_SUBJECTS"""
              lines = [m for m in (map_line(l) for l in raw.splitlines()) if m]
          # Deduplicate, keep order, cap at 30.
          seen = set()
          out = []
          for l in lines:
              if l not in seen:
                  seen.add(l)
                  out.append(l)
          print(json.dumps(out[:30], ensure_ascii=False))
          PYCHANGES
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate latest.json with version history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGES_JSON: ${{ steps.changelog.outputs.changes_json }}
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
        run: |
          mkdir -p deploy
          VERSION_NUM=$(echo "$VERSION" | sed 's/^v//')
          DATE=$(date -u +%Y-%m-%d)

          # Read SHA256 values
          WIN_ZIP_SHA=$(cat artifacts/windows/windows-zip.sha256 2>/dev/null || echo "")
          WIN_MSI_SHA=$(cat artifacts/windows/windows-msi.sha256 2>/dev/null || echo "")
          MAC_ARM_TAR_SHA=$(cat artifacts/macos-aarch64/macos-tar.sha256 2>/dev/null || echo "")
          MAC_ARM_DMG_SHA=$(cat artifacts/macos-aarch64/macos-dmg.sha256 2>/dev/null || echo "")
          LIN_TAR_SHA=$(cat artifacts/linux/linux-tar.sha256 2>/dev/null || echo "")
          LIN_DEB_SHA=$(cat artifacts/linux/linux-deb.sha256 2>/dev/null || echo "")

          # Build current version entry as JSON
          CURRENT_ENTRY=$(cat << CURRENTEOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "files": {
              "windows": {
                "portable": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-windows-x86_64.zip",
                "sha256": "${WIN_ZIP_SHA}",
                "installer": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-windows-x86_64.msi",
                "installer_sha256": "${WIN_MSI_SHA}"
              },
              "macos": {
                "portable": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-macos-aarch64.tar.gz",
                "sha256": "${MAC_ARM_TAR_SHA}",
                "installer": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-macos-aarch64.dmg",
                "installer_sha256": "${MAC_ARM_DMG_SHA}",
                "portable_aarch64": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-macos-aarch64.tar.gz",
                "sha256_aarch64": "${MAC_ARM_TAR_SHA}",
                "installer_aarch64": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-macos-aarch64.dmg",
                "installer_sha256_aarch64": "${MAC_ARM_DMG_SHA}"
              },
              "linux": {
                "portable": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-linux-x86_64.tar.gz",
                "sha256": "${LIN_TAR_SHA}",
                "installer": "${R2_PUBLIC_URL}/${VERSION}/opennex-${VERSION}-linux-amd64.deb",
                "installer_sha256": "${LIN_DEB_SHA}"
              }
            }
          }
          CURRENTEOF
          )

          # Try to download old latest.json
          OLD_HISTORY="[]"
          if wrangler r2 object get "${R2_BUCKET}/latest.json" --file=/tmp/old_latest.json --remote 2>/dev/null; then
            OLD_HISTORY=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/old_latest.json'))
              history = data.get('history', [])
              # Output as compact JSON
              print(json.dumps(history))
          except:
              print('[]')
          " 2>/dev/null || echo "[]")
          fi

          # Build new latest.json with history using Python
          python3 << PYEOF
          import json, os

          current = json.loads('''${CURRENT_ENTRY}''')
          current["changelog"] = os.environ.get("CHANGELOG", "")
          try:
              current["changes"] = json.loads(os.environ.get("CHANGES_JSON", "[]"))
          except Exception:
              current["changes"] = []
          old_history = json.loads('''${OLD_HISTORY}''')

          # Retro-fix HISTORY entries: legacy versions carry no `changes`
          # (or carry "其他: ..." noise from the old extractor). Rebuild
          # each entry's notes from its changelog, keeping ONLY
          # 新增/修复 lines — never CI-repair or chore noise.
          def map_note(l):
              l = l.strip()
              if not l:
                  return None
              low = l.lower()
              for prefix, kind in (("feat", "新增"), ("fix", "修复")):
                  if low.startswith(prefix) or l.startswith(kind):
                      return kind + ": " + (l.split(":", 1)[1].strip() if ":" in l else l)
              return None
          for h in old_history:
              if h.get("changes"):
                  h["changes"] = [l for l in h["changes"]
                                  if not l.strip().startswith("其他:")]
              else:
                  cl = h.get("changelog", "") or ""
                  h["changes"] = [m for m in (map_note(l) for l in cl.splitlines()) if m]

          # Build new history: current version first, then old ones, max 3
          new_history = [current] + old_history
          new_history = new_history[:3]

          # Find versions to delete (beyond the 3 kept)
          kept_versions = set(h["version"] for h in new_history)
          all_old_versions = set(h["version"] for h in old_history)
          to_delete = all_old_versions - kept_versions

          # Also add current to old version list for deletion check
          # (current version won't be in old list, so no issue)

          latest = {
              "version": current["version"],
              "date": current["date"],
              "files": current["files"],
              "history": new_history
          }

          with open("deploy/latest.json", "w") as f:
              json.dump(latest, f, indent=2)

          # Write versions to delete to a file for the next step
          with open("/tmp/versions_to_delete.txt", "w") as f:
              for v in to_delete:
                  f.write(v + "\n")

          print("=== latest.json ===")
          print(json.dumps(latest, indent=2))

          if to_delete:
              print("\n=== Versions to delete from R2 ===")
              for v in to_delete:
                  print(f"  v{v}")
          PYEOF

      - name: Clean up old R2 versions
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
        run: |
          if [ -f /tmp/versions_to_delete.txt ]; then
            while IFS= read -r version; do
              [ -z "$version" ] && continue
              echo "Deleting old version v${version} from R2..."
              # List objects in the version directory
              OBJECTS=$(wrangler r2 object list "${R2_BUCKET}/v${version}/" --remote 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for obj in data:
                  print(obj['key'])
          except:
              pass
          " 2>/dev/null || echo "")
              for obj_key in $OBJECTS; do
                echo "  Deleting $obj_key..."
                wrangler r2 object delete "${R2_BUCKET}/${obj_key}" --remote 2>/dev/null || true
              done
            done < /tmp/versions_to_delete.txt
          fi

      - name: Sign latest.json (ed25519, detached)
        # Clients refuse unsigned manifests (poisoning protection). The
        # private key lives in the OPENNEX_UPDATE_SIGNING_KEY secret as a
        # PKCS#8 PEM whose public half is embedded in the binary.
        env:
          OPENNEX_UPDATE_SIGNING_KEY: ${{ secrets.OPENNEX_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$OPENNEX_UPDATE_SIGNING_KEY" ]; then
            echo "::error::OPENNEX_UPDATE_SIGNING_KEY secret is missing — clients will REJECT this release's manifest."
            exit 1
          fi
          printf '%s' "$OPENNEX_UPDATE_SIGNING_KEY" > /tmp/signing-key.pem
          openssl pkeyutl -sign -inkey /tmp/signing-key.pem -rawin \
            -in deploy/latest.json | base64 -w 0 > deploy/latest.json.sig
          rm -f /tmp/signing-key.pem
          # Self-check: verify with the COMMITTED public key (the one
          # embedded in client binaries) BEFORE anything is uploaded —
          # a format mismatch here would brick every client's update.
          openssl pkeyutl -verify \
            -inkey research/formalization/audit/update-signing-pub.pem \
            -pubin -rawin -in deploy/latest.json \
            -sigfile <(base64 -d deploy/latest.json.sig) \
            || { echo "::error::signature self-check failed"; exit 1; }
          echo "signature ok: $(wc -c < deploy/latest.json.sig) base64 chars -> $(base64 -d deploy/latest.json.sig | wc -c) raw bytes"

      - name: Upload latest.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put "${{ env.R2_BUCKET }}/latest.json" --file=deploy/latest.json --remote --content-type="application/json"
          wrangler r2 object put "${{ env.R2_BUCKET }}/latest.json.sig" --file=deploy/latest.json.sig --remote --content-type="application/octet-stream"

      - name: Create GitHub Release
        # Archive every release on GitHub: attach all installers as
        # release assets for historical download. Best-effort — a GitHub
        # hiccup must not fail the publish (R2 is the primary channel).
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Trigger website rebuild
        if: success()
        # Hook failures (bad URL, secret missing, CF hiccup) must never fail
        # the release: artifacts and latest.json are already published.
        continue-on-error: true
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CF_DEPLOY_HOOK_URL not configured — skipping website rebuild trigger."
            exit 0
          fi
          # Wait for latest.json to propagate on R2/CDN before the website
          # build fetches it.
          sleep 30
          curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "Website rebuild triggered."

[package]
name = "egui_dock"
version = "0.16.0"
edition = "2021"
rust-version = "1.81"
description = "Fork of egui_dock 0.16 with OpenNex tab-bar patches"
license = "MIT"

[dependencies]
egui = { version = "0.31", features = ["serde"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
duplicate = "2"
paste = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

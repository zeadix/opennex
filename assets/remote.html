<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>OpenNex Remote</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #16181d; color: #d8d8dc; font-family: sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { background: #1e2128; border-bottom: 1px solid #2c3038; overflow-x: auto; white-space: nowrap; }
  .bar .tabs { display: flex; padding: 4px; }
  .tab { padding: 6px 12px; margin: 0 2px; border-radius: 6px; font-size: 13px; color: #9aa0aa; cursor: pointer; flex-shrink: 0; }
  .tab.active { background: #2f6fed; color: #fff; }
  .tab.locked { color: #e0a800; }
  #term { flex: 1; position: relative; background: #0c0d10; overflow: hidden; }
  #term .xterm { position: absolute; left: 0; top: 0; }
  .status { padding: 3px 8px; font-size: 11px; color: #9aa0aa; background: #1e2128; border-top: 1px solid #2c3038; }
  .status.err { color: #e06060; }
  #keys { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; background: #1e2128; border-top: 1px solid #2c3038; }
  .key { padding: 7px 11px; font-size: 13px; border-radius: 6px; background: #2c3038; color: #d8d8dc; cursor: pointer; user-select: none; -webkit-user-select: none; flex-shrink: 0; }
  .key:active { background: #2f6fed; }
  .key.on { background: #2f6fed; color: #fff; }
  .key.tool { background: #1e2128; color: #9aa0aa; font-size: 12px; }
  #keys.collapsed .key { display: none; }
  #keys.collapsed .key.tool { display: block; }
  #keys.collapsed { padding: 3px 5px; }
  #cmdbar { display: none; padding: 5px; background: #1e2128; border-top: 1px solid #2c3038; }
  #cmdbar.show { display: flex; gap: 5px; }
  #cmdbar input { flex: 1; padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #2c3038; background: #0c0d10; color: #d8d8dc; font-family: monospace; }
  #cmdbar button { padding: 8px 14px; font-size: 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; }
  #copybox { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 6; background: #16181d; flex-direction: column; }
  #copybox.show { display: flex; }
  #copybox textarea { flex: 1; margin: 8px; padding: 8px; font-family: monospace; font-size: 13px; background: #0c0d10; color: #d8d8dc; border: 1px solid #2c3038; border-radius: 6px; }
  #copybox .row { display: flex; gap: 6px; padding: 0 8px 8px; }
  #copybox button { flex: 1; padding: 10px; font-size: 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; }
  #copybox button.ghost { background: #2c3038; }
  #unlock { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; background: #16181d; z-index: 5; }
  #unlock .box { text-align: center; }
  #unlock input { margin: 10px; padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #2c3038; background: #0c0d10; color: #d8d8dc; }
  #unlock button { padding: 8px 20px; font-size: 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar"><div class="tabs" id="wstabs"></div></div>
  <div class="bar"><div class="tabs" id="termtabs"></div></div>
  <div id="term">
    <div id="unlock"><div class="box">
      <div id="unlock-msg">This workspace is locked. Enter the password to unlock.</div>
      <input type="password" id="unlock-pw" autocomplete="off">
      <button id="unlock-btn">Unlock</button>
    </div></div>
  </div>
  <div id="cmdbar">
    <input id="cmd-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="cmd-send">Run</button>
  </div>
  <div id="keys">
    <div class="key" data-k="esc">Esc</div>
    <div class="key" data-k="tab">Tab</div>
    <div class="key" data-k="ctrl" id="ctrl-key">Ctrl</div>
    <div class="key" data-k="up">↑</div>
    <div class="key" data-k="down">↓</div>
    <div class="key" data-k="left">←</div>
    <div class="key" data-k="right">→</div>
    <div class="key" data-k="pgup">PgUp</div>
    <div class="key" data-k="pgdn">PgDn</div>
    <div class="key" data-k="home">Home</div>
    <div class="key" data-k="end">End</div>
    <div class="key" data-k="ctrlc">Ctrl+C</div>
    <div class="key" data-k="ctrld">Ctrl+D</div>
    <div class="key" data-k="ctrll">Ctrl+L</div>
    <div class="key" data-k="paste">Paste</div>
    <div class="key" data-k="copy">Copy</div>
    <div class="key" data-k="bottom">⤓</div>
    <div class="key tool" data-k="cmdbar">Aa</div>
    <div class="key tool" data-k="collapse">▾</div>
  </div>
  <div class="status" id="status"><span id="status-text"></span> <span class="key" id="follow-btn" style="padding:2px 8px;font-size:10px;float:right;">Follow</span></div>
  <div id="copybox">
    <textarea id="copy-text" readonly></textarea>
    <div class="row">
      <button id="copy-done" class="ghost">Close</button>
      <button id="copy-select">Select all</button>
    </div>
  </div>
</div>
<script src="/xterm.js"></script>
<script>
/* OpenNex remote page v2 - xterm.js renderer + WebSocket live sync.
   Plain ES5-ish JS for WeChat X5 compatibility. */
(function () {
  var TOKEN = (function () {
    var m = location.search.match(/[?&]token=([^&]+)/);
    return m ? m[1] : '';
  })();
  var state = { ws: [], wsIndex: 0, termIndex: 0, locked: false };
  var term = new Terminal({
    fontFamily: '"Cascadia Mono", Consolas, "Courier New", monospace',
    fontSize: 13,
    theme: { background: '#0c0d10', foreground: '#d8d8dc' },
    scrollback: 2000,
    convertEol: false
  });
  var termEl = document.getElementById('term');
  term.open(termEl);
  var statusEl = document.getElementById('status');
  var unlockEl = document.getElementById('unlock');
  var ws = null;
  var wsOk = false;
  var ctrlMode = false;
  var lastFrame = { cols: 0, rows: 0, alt: null, app_cursor: null, seq: -1 };
  var reconnectDelay = 500;
  var fallbackPoll = null;

  function setStatus(msg, isErr) {
    var textEl = document.getElementById('status-text');
    if (textEl) textEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }
  document.getElementById('follow-btn').addEventListener('click', function () {
    followDesktop = !followDesktop;
    this.className = followDesktop ? 'key on' : 'key';
    this.textContent = T.follow + (followDesktop ? ' ✓' : '');
    updateStatus();
  });

  function post(path, body, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', path + '?token=' + encodeURIComponent(TOKEN), true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && cb) cb(xhr.status);
    };
    xhr.send(body ? JSON.stringify(body) : null);
  }

  function get(path, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', path + (path.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) cb(xhr.status, xhr.responseText);
    };
    xhr.send(null);
  }

  function currentTab() {
    var cur = state.ws[state.wsIndex];
    if (!cur || cur.locked || !cur.terminals.length) return null;
    if (state.termIndex >= cur.terminals.length) state.termIndex = 0;
    return cur.terminals[state.termIndex];
  }

  function sendInput(data) {
    var tab = currentTab();
    if (!tab) return;
    if (wsOk && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ t: 'input', tab: tab.id, d: data }));
    } else {
      post('/api/input', { tab: tab.id, data: data });
    }
  }

  // ----- xterm input -----
  term.onData(function (d) {
    if (ctrlMode && d.length === 1) {
      // Sticky Ctrl: map the next plain char to its control code.
      var c = d.toUpperCase().charCodeAt(0);
      if (c >= 64 && c <= 95) d = String.fromCharCode(c - 64);
      ctrlMode = false;
      document.getElementById('ctrl-key').className = 'key';
    }
    sendInput(d);
  });

  // ----- special key toolbar -----
  var REPEAT_KEYS = { up: 1, down: 1, left: 1, right: 1, pgup: 1, pgdn: 1 };
  function keySeq(k) {
    var map = {
      esc: '\x1b', tab: '\t', up: '\x1b[A', down: '\x1b[B',
      right: '\x1b[C', left: '\x1b[D',
      pgup: '\x1b[5~', pgdn: '\x1b[6~', home: '\x1b[H', end: '\x1b[F',
      ctrlc: '\x03', ctrld: '\x04', ctrll: '\x0c'
    };
    return map[k] || null;
  }
  function pasteIntoTerminal() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (text) sendInput(text);
      }, function () { showCopyBox(''); });
    } else {
      showCopyBox('');
    }
  }
  function showCopyBox(text) {
    var box = document.getElementById('copybox');
    document.getElementById('copy-text').value = text;
    box.className = 'show';
    document.getElementById('copy-text').focus();
  }
  function copyTerminalOutput() {
    term.selectAll();
    var text = term.getSelection();
    term.clearSelection();
    term.scrollToBottom();
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus(T.copied);
      }, function () { showCopyBox(text); });
    } else {
      showCopyBox(text);
    }
  }
  function scrollBottom() {
    if (wsOk && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ t: 'scroll_bottom' }));
    } else {
      get('/api/scroll_bottom', function () {});
    }
    term.scrollToBottom();
  }
  function toolbarAction(k, el) {
    if (k === 'ctrl') {
      ctrlMode = !ctrlMode;
      el.className = 'key' + (ctrlMode ? ' on' : '');
      return;
    }
    if (k === 'paste') { pasteIntoTerminal(); return; }
    if (k === 'copy') { copyTerminalOutput(); return; }
    if (k === 'bottom') { scrollBottom(); return; }
    if (k === 'collapse') {
      var keys = document.getElementById('keys');
      keys.className = keys.className === 'collapsed' ? '' : 'collapsed';
      el.textContent = keys.className === 'collapsed' ? '▴' : '▾';
      return;
    }
    if (k === 'cmdbar') {
      var bar = document.getElementById('cmdbar');
      var on = bar.className === 'show';
      bar.className = on ? '' : 'show';
      el.className = 'key tool' + (on ? '' : ' on');
      if (!on) document.getElementById('cmd-input').focus();
      else term.focus();
      return;
    }
    var seq = keySeq(k);
    if (seq) sendInput(seq);
    term.focus();
  }
  document.getElementById('keys').addEventListener('click', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k) return;
    toolbarAction(k, e.target);
  });
  // Long-press auto-repeat for arrows/PgUp/PgDn (vim/less navigation).
  document.getElementById('keys').addEventListener('pointerdown', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k || !REPEAT_KEYS[k]) return;
    var seq = keySeq(k);
    if (!seq) return;
    var timer = null;
    var started = false;
    var start = function () {
      started = true;
      timer = setInterval(function () { sendInput(seq); }, 80);
    };
    var delay = setTimeout(start, 400);
    var stop = function () {
      clearTimeout(delay);
      if (timer) clearInterval(timer);
      if (!started) sendInput(seq);
      document.removeEventListener('pointerup', stop);
      document.removeEventListener('pointercancel', stop);
    };
    document.addEventListener('pointerup', stop);
    document.addEventListener('pointercancel', stop);
  });

  // ----- command bar (line mode) -----
  document.getElementById('cmd-send').addEventListener('click', function () {
    var input = document.getElementById('cmd-input');
    var line = input.value;
    if (!line) return;
    sendInput(line + '\r');
    input.value = '';
    term.focus();
  });
  document.getElementById('cmd-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('cmd-send').click(); }
  });

  // ----- copy box -----
  document.getElementById('copy-done').addEventListener('click', function () {
    document.getElementById('copybox').className = '';
    term.focus();
  });
  document.getElementById('copy-select').addEventListener('click', function () {
    var ta = document.getElementById('copy-text');
    ta.focus();
    ta.select();
  });

  // ----- soft-keyboard occlusion -----
  // Compress the app to the VISIBLE viewport so the toolbar stays above
  // the keyboard (the moment you need Ctrl+C the most).
  function applyVisualViewport() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    document.getElementById('wrap').style.height = h + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyVisualViewport);
  }
  window.addEventListener('resize', applyVisualViewport);
  applyVisualViewport();

  // ----- orientation / rotation refit -----
  window.addEventListener('orientationchange', function () {
    fittedCols = -1;
    var f = lastFrame;
    if (f.cols) fitFont(f.cols);
  });
  // In APP_CURSOR mode xterm itself emits SS3 arrows; our toolbar keys
  // keep CSI form which all common TUIs accept too.

  // ----- mouse forwarding (TUI applications) -----
  // Only active when the app enabled mouse reporting (mouse_mode rides
  // along in frames); otherwise touches stay as local scrolling.
  var mouseMode = false;
  var mouseCell = { w: 8, h: 16 };
  function measureCells() {
    var rows = document.querySelectorAll('#term .xterm-rows');
    if (rows.length) {
      var r = rows[0].getBoundingClientRect();
      if (r.height > 4) mouseCell.h = r.height / (term.rows || 24);
      mouseCell.w = r.width / (term.cols || 80);
    }
  }
  function sendMouse(btn, col, row, pressed) {
    var tab = currentTab();
    if (!tab) return;
    if (wsOk && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ t: 'mouse', tab: tab.id, btn: btn, col: col, row: row, pressed: pressed }));
    }
  }
  var touchStart = null;
  termEl.addEventListener('touchstart', function (e) {
    if (!mouseMode) return;
    measureCells();
    var t = e.touches[0];
    var rect = termEl.getBoundingClientRect();
    var x = t.clientX - rect.left;
    var y = t.clientY - rect.top;
    touchStart = { x: x, y: y, sent: false };
    var col = Math.max(0, Math.floor(x / mouseCell.w));
    var row = Math.max(0, Math.floor(y / mouseCell.h));
    touchStart.col = col;
    touchStart.row = row;
    sendMouse(0, col, row, true);
  }, { passive: true });
  termEl.addEventListener('touchmove', function (e) {
    if (!mouseMode || !touchStart) return;
    var t = e.touches[0];
    var rect = termEl.getBoundingClientRect();
    var col = Math.max(0, Math.floor((t.clientX - rect.left) / mouseCell.w));
    var row = Math.max(0, Math.floor((t.clientY - rect.top) / mouseCell.h));
    if (col !== touchStart.col || row !== touchStart.row) {
      sendMouse(32, col, row, true);
      touchStart.col = col;
      touchStart.row = row;
      touchStart.sent = true;
    }
  }, { passive: true });
  termEl.addEventListener('touchend', function (e) {
    if (!mouseMode || !touchStart) return;
    sendMouse(0, touchStart.col, touchStart.row, false);
    touchStart = null;
  }, { passive: true });
  // Wheel emulation: two-finger vertical swipe in mouse mode.
  termEl.addEventListener('touchmove', function (e) {
    if (!mouseMode || e.touches.length < 2 || !touchStart) return;
    var t = e.touches[0];
    var dy = t.clientY - touchStart.y;
    if (Math.abs(dy) > 40) {
      var btn = dy < 0 ? 64 : 65;
      sendMouse(btn, touchStart.col || 0, touchStart.row || 0, true);
      touchStart.y = t.clientY;
    }
  }, { passive: true });

  // ----- frames -----
  // Fit the terminal width to the viewport: pick the largest font size
  // whose cols still fit, so 80-column screens are not cropped on
  // phones (clamped to a readable minimum; users can pinch-zoom beyond).
  var fittedCols = -1;
  function fitFont(cols) {
    if (cols === fittedCols || !cols) return;
    fittedCols = cols;
    var avail = window.innerWidth - 12;
    // xterm character width ~ 0.6 * font size for common monospace.
    var size = Math.floor(avail / (cols * 0.6));
    size = Math.max(8, Math.min(size, 16));
    term.options.fontSize = size;
  }

  function applyFrame(f) {
    if (f.seq === lastFrame.seq) return;
    lastFrame.seq = f.seq;
    if (f.cols !== lastFrame.cols || f.rows !== lastFrame.rows) {
      lastFrame.cols = f.cols;
      lastFrame.rows = f.rows;
      fitFont(f.cols);
      term.resize(f.cols, f.rows);
    }
    if (f.alt !== lastFrame.alt) {
      lastFrame.alt = f.alt;
      term.write(f.alt ? '\x1b[?1049h' : '\x1b[?1049l');
    }
    if (f.app_cursor !== lastFrame.app_cursor) {
      lastFrame.app_cursor = f.app_cursor;
      term.write(f.app_cursor ? '\x1b[?1h' : '\x1b[?1l');
    }
    mouseMode = !!f.mouse_mode;
    term.write(f.d);
    updateStatus();
  }

  // ----- websocket -----
  function connectWs(isRetry) {
    if (fallbackPoll && !isRetry) return;
    if (ws && ws.readyState === 1) return;
    try {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(TOKEN));
    } catch (e) {
      startFallback();
      return;
    }
    ws.onopen = function () {
      wsOk = true;
      reconnectDelay = 500;
      // Stop the fallback poller if it was running.
      if (fallbackPoll) { clearInterval(fallbackPoll); fallbackPoll = null; }
      setStatus('Live');
      // Fresh connection: reset so the scrollback seed cannot append on
      // top of a half-drawn buffer (reconnect used to duplicate history).
      term.reset();
      lastFrame = { cols: 0, rows: 0, alt: null, app_cursor: null, seq: -1 };
      ctrlMode = false;
      var ctrlKey = document.getElementById('ctrl-key');
      if (ctrlKey) ctrlKey.className = 'key';
      ws.send(JSON.stringify({ t: 'hello' }));
      var tab = currentTab();
      if (tab) {
        ws.send(JSON.stringify({ t: 'focus', tab: tab.id }));
        ws.send(JSON.stringify({ t: 'scrollback', tab: tab.id }));
      }
      term.focus();
    };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (err) { return; }
      if (m.t === 'frame') {
        var cur = currentTab();
        if (cur && m.tab === cur.id) applyFrame(m);
      } else if (m.t === 'scrollback') {
        var t0 = currentTab();
        // Match the answer to the CURRENT tab: a late answer for a tab
        // we already switched away from must not paint over the new one.
        if (t0 && m.tab === t0.id) {
          term.write('\x1b[?1049l');
          term.write(m.d);
          // The server follows with the current frame; make sure the
          // alt-screen tracker agrees with the primary buffer we just
          // wrote (otherwise a TUI frame would land in the wrong buffer).
          lastFrame.alt = false;
          lastFrame.seq = -1;
        }
      } else if (m.t === 'bye') {
        setStatus('Closed by app', true);
      }
    };
    ws.onclose = function () {
      wsOk = false;
      if (reconnectDelay >= 4000) {
        startFallback();
        return;
      }
      setStatus('Reconnecting…', true);
      setTimeout(connectWs, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 4000);
    };
    ws.onerror = function () { /* onclose follows */ };
  }

  // ----- HTTP fallback polling -----
  function startFallback() {
    if (fallbackPoll) return;
    setStatus('Fallback mode (polling)', true);
    fallbackPoll = setInterval(function () {
      var tab = currentTab();
      if (!tab) return;
      get('/api/frame?tab=' + encodeURIComponent(tab.id), function (code, body) {
        if (code === 200 && body) {
          try { applyFrame(JSON.parse(body)); } catch (e) {}
        }
      });
    }, 150);
    // The fallback is a detour, not a destination: keep retrying the
    // socket (onopen stops the poller when it comes back).
    wsRetry = setInterval(function () {
      connectWs(true);
    }, 30000);
  }
  var wsRetry = null;

  // ----- tabs / state -----
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function requestScrollback(tabId) {
    if (wsOk && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ t: 'scrollback', tab: tabId }));
    } else {
      get('/api/scrollback?tab=' + encodeURIComponent(tabId), function (code, body) {
        if (code === 200 && body) {
          try { term.write(JSON.parse(body)); } catch (e) {}
        }
      });
    }
  }

  function selectTerminal(idx) {
    state.termIndex = idx;
    // Full reset: buffered content, alt-screen and sticky Ctrl from the
    // previous terminal must not leak into the new one.
    lastFrame = { cols: 0, rows: 0, alt: null, app_cursor: null, seq: -1 };
    term.reset();
    ctrlMode = false;
    var ctrlKey = document.getElementById('ctrl-key');
    if (ctrlKey) ctrlKey.className = 'key';
    var tab = currentTab();
    if (tab) {
      if (wsOk && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ t: 'focus', tab: tab.id }));
      } else {
        post('/api/focus', { tab: tab.id });
      }
      requestScrollback(tab.id);
    }
    renderTabs();
    term.focus();
  }

  function renderTabs() {
    var wsArr = state.ws;
    if (!wsArr.length) return;
    if (state.wsIndex >= wsArr.length) state.wsIndex = 0;
    var cur = wsArr[state.wsIndex];
    var wsel = document.getElementById('wstabs');
    var html = '';
    for (var i = 0; i < wsArr.length; i++) {
      html += '<div class="tab' + (i === state.wsIndex ? ' active' : '') + (wsArr[i].locked ? ' locked' : '') + '" data-ws="' + i + '">' +
        escapeHtml(wsArr[i].name) + (wsArr[i].locked ? ' 🔒' : '') + '</div>';
    }
    wsel.innerHTML = html;
    var wsTabs = wsel.querySelectorAll('.tab');
    for (var j = 0; j < wsTabs.length; j++) {
      (function (idx) {
        wsTabs[j].addEventListener('click', function () {
          state.wsIndex = idx;
          state.termIndex = 0;
          selectTerminal(0);
        });
      })(parseInt(wsTabs[j].getAttribute('data-ws'), 10));
    }
    var tsel = document.getElementById('termtabs');
    if (cur.locked) {
      tsel.innerHTML = '';
      state.locked = true;
    } else {
      state.locked = false;
      if (state.termIndex >= cur.terminals.length) state.termIndex = 0;
      var thtml = '';
      for (var k = 0; k < cur.terminals.length; k++) {
        thtml += '<div class="tab' + (k === state.termIndex ? ' active' : '') + '" data-t="' + k + '">' +
          escapeHtml(cur.terminals[k].name) + '</div>';
      }
      tsel.innerHTML = thtml;
      var tTabs = tsel.querySelectorAll('.tab');
      for (var m = 0; m < tTabs.length; m++) {
        (function (idx) {
          tTabs[m].addEventListener('click', function () { selectTerminal(idx); });
        })(parseInt(tTabs[m].getAttribute('data-t'), 10));
      }
      // NOTE: no focus message here. renderTabs also runs on the 2s
      // periodic state refresh - re-focusing would fight the desktop
      // user for focus every 2 seconds. Focus is sent ONLY from
      // selectTerminal (user-driven).
    }
    unlockEl.style.display = state.locked ? 'flex' : 'none';
  }

  var followDesktop = false;
  var lastDesktopFocus = null;
  var lastRtt = null;
  var L = (navigator.language || 'en').toLowerCase().indexOf('zh') === 0;
  var T = {
    live: L ? '实时' : 'Live',
    fallback: L ? '轮询模式' : 'Fallback (polling)',
    connecting: L ? '连接中…' : 'Connecting…',
    disconnected: L ? '已断开' : 'Disconnected',
    noWs: L ? '无工作区' : 'No workspaces',
    copied: L ? '已复制' : 'Copied',
    run: L ? '运行' : 'Run',
    follow: L ? '跟随' : 'Follow',
    mouse: L ? '鼠标' : 'Mouse',
    desktop: L ? '桌面' : 'Desktop'
  };
  document.getElementById('cmd-send').textContent = T.run;

  function refreshState() {
    var t0 = Date.now();
    get('/api/state', null, function (code, body) {
      if (code !== 200) { setStatus(T.disconnected + ' (' + code + ')', true); return; }
      lastRtt = Date.now() - t0;
      var s = JSON.parse(body);
      state.ws = s.workspaces || [];
      if (!state.ws.length) { setStatus(T.noWs); return; }
      // Optional follow-the-desktop focus (off by default: the phone is
      // usually the viewer and must not chase the desktop's typing).
      if (followDesktop && s.focused && s.focused !== lastDesktopFocus) {
        for (var wi = 0; wi < state.ws.length; wi++) {
          var terms = state.ws[wi].terminals || [];
          for (var ti = 0; ti < terms.length; ti++) {
            if (terms[ti].id === s.focused) {
              state.wsIndex = wi;
              selectTerminal(ti);
              break;
            }
          }
        }
      }
      lastDesktopFocus = s.focused || null;
      renderTabs();
      updateStatus();
    });
  }
  function updateStatus() {
    var parts = [];
    parts.push(wsOk ? T.live : (fallbackPoll ? T.fallback : T.connecting));
    if (lastRtt !== null) parts.push(lastRtt + 'ms');
    if (lastFrame.cols) parts.push(lastFrame.cols + '×' + lastFrame.rows);
    if (mouseMode) parts.push(T.mouse);
    if (followDesktop && lastDesktopFocus) {
      var cur = state.ws[state.wsIndex];
      if (cur) {
        for (var i = 0; i < (cur.terminals || []).length; i++) {
          if (cur.terminals[i].id === lastDesktopFocus) {
            parts.push(T.desktop + ': ' + cur.terminals[i].name);
            break;
          }
        }
      }
    }
    setStatus(parts.join(' · '));
  }

  document.getElementById('unlock-btn').addEventListener('click', function () {
    var pw = document.getElementById('unlock-pw').value;
    post('/api/unlock', { panel: state.wsIndex, password: pw }, function (code) {
      if (code === 200) {
        document.getElementById('unlock-pw').value = '';
        refreshState();
      } else {
        document.getElementById('unlock-msg').textContent = 'Wrong password - try again.';
      }
    });
  });

  termEl.addEventListener('click', function () { term.focus(); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) term.focus();
  });

  // Boot: state first (tab bars), then live connection.
  refreshState();
  connectWs();
  setInterval(refreshState, 2000);
  term.focus();
})();
</script>
</body>
</html>

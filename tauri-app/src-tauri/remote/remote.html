<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OpenNex Remote</title>
<link rel="stylesheet" href="/remote/xterm.css">
<style>
  html,body{height:100%;margin:0;background:#0b0e14;color:#d6dbe6;font-family:system-ui,sans-serif}
  #term{position:absolute;inset:44px 0 52px 0;padding:4px}
  #bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#10141b;border-bottom:1px solid #222a38}
  #bar select{background:#171c26;color:#d6dbe6;border:1px solid #222a38;border-radius:6px;padding:6px;font-size:13px}
  #bar span{font-size:12px;color:#8b93a5}
  #inputrow{position:absolute;bottom:0;left:0;right:0;height:52px;display:flex;gap:8px;padding:8px 10px;background:#10141b;border-top:1px solid #222a38}
  #cmd{flex:1;background:#0b0e14;border:1px solid #222a38;border-radius:8px;color:#d6dbe6;padding:8px 12px;font-family:monospace;font-size:14px;outline:none}
  #send{background:#23465c;color:#4fc3f7;border:none;border-radius:8px;padding:0 18px;font-size:14px}
  #send:active{filter:brightness(1.4)}
  #keys{position:absolute;bottom:52px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#0d1119;border-top:1px solid #1a2130}
  #keys button{flex-shrink:0;background:#171c26;color:#d6dbe6;border:1px solid #222a38;border-radius:6px;padding:7px 12px;font-family:monospace;font-size:12px}
  #keys button:active{background:#23465c}
  #term{inset:44px 0 104px 0}
</style>
</head>
<body>
<div id="bar">
  <span>OpenNex 远程</span>
  <select id="sessionSel"></select>
</div>
<div id="term"></div>
<div id="keys">
  <button data-k="\u001b">Esc</button>
  <button data-k="\t">Tab</button>
  <button data-k="\u0003">^C</button>
  <button data-k="\u0004">^D</button>
  <button data-k="\u001b[A">↑</button>
  <button data-k="\u001b[B">↓</button>
  <button data-k="\u001b[D">←</button>
  <button data-k="\u001b[C">→</button>
  <button data-k="\u001b[3~">Del</button>
  <button data-k="\u001b[H">Home</button>
  <button data-k="\u001b[F">End</button>
</div>
<div id="inputrow">
  <input id="cmd" placeholder="输入命令（回车执行）" autocomplete="off">
  <button id="send">执行</button>
</div>
<script src="/remote/xterm.js"></script>
<script src="/remote/fit.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const myToken = params.get("k") || "";
  const term = new window.Terminal({ fontSize: 13, theme: { background: "#0b0e14", foreground: "#d6dbe6", cursor: "#4fc3f7" } });
  const fit = new window.FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  term.writeln("\x1b[90m连接中…\x1b[0m");
  function doFit() {
    try { fit.fit(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); } catch (e) {}
  }
  window.addEventListener("resize", doFit);
  new ResizeObserver(doFit).observe(document.getElementById("term"));
  let ws = null, cur = "";
  async function loadSessions() {
    const r = await fetch("/remote/sessions?k=" + encodeURIComponent(myToken));
    const list = await r.json();
    const sel = document.getElementById("sessionSel");
    sel.innerHTML = "";
    list.forEach((s) => {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.name;
      sel.appendChild(o);
    });
    return list;
  }
  function attach(sessionId) {
    if (ws) { ws.onclose = null; ws.close(); }
    term.reset();
    cur = sessionId;
    ws = new WebSocket(((location.protocol === "https:") ? "wss://" : "ws://") + location.host + "/ws?session=" + sessionId + "&k=" + encodeURIComponent(myToken));
    ws.binaryType = "arraybuffer";
    ws.onmessage = (e) => term.write(new Uint8Array(e.data));
    ws.onopen = () => { doFit(); term.scrollToBottom(); };
    term.onData((d) => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  }
  document.getElementById("sessionSel").addEventListener("change", (e) => attach(e.target.value));
  function runCmd() {
    const v = document.getElementById("cmd").value;
    if (!v) return;
    if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(v + "\r"));
    document.getElementById("cmd").value = "";
  }
  document.getElementById("send").addEventListener("click", runCmd);
  document.querySelectorAll("#keys button").forEach((b) => {
    b.addEventListener("click", () => {
      const k = b.getAttribute("data-k").replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
      if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(k));
      term.focus();
    });
  });
  document.getElementById("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") runCmd(); });
  loadSessions().then((list) => { if (list.length) attach(list[0].id); });
})();
</script>
</body>
</html>

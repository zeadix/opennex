[package]
name = "opennex-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "opennex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "net"] }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
sysinfo = "0.33"

about:
  menu_label: Über
  title: Über OpenNex
  version_label: Version
  description: 'Ein Multi-Window-Stacking-Terminal-Manager für KI-Workflows und Vielnutzer der Kommandozeile.


    Terminal-Fensterlayouts frei anordnen und Sitzungen über Tab-Stacking verwalten; Layouts speichern und laden. Enthält unbegrenzte Sitzungs-Befehlshistorie, globale Interface-Skalierung, eigene Themes,
    verschlüsselte Arbeitsbereiche und konfigurierbare Shortcuts — alles für die Kontrolle komplexer Terminal-Umgebungen.


    In Rust gebaut: Die Hochleistungs-Engine betreibt stabil 6000+ aktive Fenster parallel, mit nativer Plattformunterstützung für Linux, Windows und macOS sowie 20+ Sprachen.

    Fehler gefunden oder Verbesserungsvorschläge? Feedback ist willkommen.'
  homepage_label: Webseite
  source_label: Quellcode
  license_label: Lizenz
  credits_label: Danksagung
  credits: Basiert auf Open-Source-Projekten wie egui, egui_dock, alacritty_terminal und egui_term.

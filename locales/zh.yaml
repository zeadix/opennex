about:
  menu_label: 关于
  title: 关于 OpenNex
  version_label: 版本
  description: '一款面向 AI 应用场景与命令行重度使用者的多窗口堆叠式终端管理器。


    支持自由排布终端窗口布局、标签堆叠管理大量会话，布局可保存与加载；内置无限会话命令记忆、全局界面缩放、自定义主题美化、工作区加密保护，自定义快捷键等能力，一站式管控复杂的终端运行环境。


    基于 Rust 构建，高性能引擎可稳定支撑6000+ 活动窗口并行运行，原生跨平台支持 Linux、Windows、macOS，并提供 20+ 国际化语言。

    如在使用中遇到 Bug 或有功能优化建议，欢迎反馈。'

about:
  menu_label: Informazioni
  title: Informazioni su OpenNex
  version_label: Versione
  description: 'Un gestore di terminali multi-finestra a schede impilate, pensato per flussi di lavoro AI e utilizzatori intensivi della riga di comando.


    Disponi liberamente i layout delle finestre dei terminali e impila le schede per gestire numerose sessioni; i layout si salvano e ricaricano. Include cronologia comandi illimitata per sessione, zoom
    globale dell''interfaccia, temi personalizzati, aree di lavoro cifrate e scorciatoie configurabili — tutto per dominare un ambiente terminale complesso.


    Costruito in Rust: il motore ad alte prestazioni regge stabilmente 6000+ finestre attive in parallelo, con supporto nativo per Linux, Windows e macOS, e oltre 20 lingue.

    Trovato un bug o hai un suggerimento? Feedback benvenuto.'

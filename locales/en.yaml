about:
  menu_label: About
  title: About OpenNex
  version_label: Version
  description: 'A multi-window stacked terminal manager built for AI workflows and heavy command-line users.


    Freely arrange terminal window layouts and stack tabs to manage many sessions; layouts can be saved and loaded. Ships with unlimited session command history, global interface scaling, custom themes,
    encrypted workspaces, and configurable shortcuts — everything you need to tame a complex terminal environment.


    Built in Rust: the high-performance engine comfortably runs 6000+ active windows in parallel, with native cross-platform support for Linux, Windows, and macOS, plus 20+ localized languages.

    Found a bug or have a suggestion? Feedback is welcome.'
  homepage_label: Homepage
  source_label: Source
  license_label: License
  credits_label: Credits
  credits: Built on open-source projects including egui, egui_dock, alacritty_terminal, and egui_term.

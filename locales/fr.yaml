about:
  menu_label: À propos
  title: À propos d'OpenNex
  version_label: Version
  description: 'Un gestionnaire de terminaux empilables multi-fenêtres, pensé pour les workflows IA et les utilisateurs intensifs de la ligne de commande.


    Disposez librement les fenêtres de terminaux et empilez les onglets pour gérer de nombreuses sessions ; les dispositions s''enregistrent et se rechargent. Intègre un historique illimité des commandes
    par session, un zoom global de l''interface, des thèmes personnalisés, des espaces chiffrés et des raccourcis configurables — tout pour maîtriser un environnement de terminaux complexe.


    Conçu en Rust : le moteur haute performance fait tourner 6000+ fenêtres actives en parallèle, avec un support natif de Linux, Windows et macOS, et plus de 20 langues.

    Un bug ou une suggestion ? Vos retours sont les bienvenus.'

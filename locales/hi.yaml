help:
  title: सहायता
  content: |
    OpenNex एक क्रॉस-प्लेटफ़ॉर्म स्टैक्ड टर्मिनल मैनेजर है।

    कार्यक्षेत्र: बाएं साइडबार में कई बनाएँ, प्रत्येक का अपना लेआउट और लॉक; हैंडल से क्रम बदलें।
    स्प्लिट और टैब: क्षैतिज/लंबवत स्प्लिट और नेस्टेड टैब; शॉर्टकट सेटिंग में बदलें।
    SSH होस्ट: नीचे-बाएँ प्रबंधित करें, क्लिक करने पर वर्तमान कार्यक्षेत्र में कनेक्ट; PROD होस्ट चेतावनी दिखाते हैं।
    रिमोट नियंत्रण: मेनू रिमोट नियंत्रण → LAN/WAN, QR स्कैन करें और टर्मिनल लाइव चलाएँ; वर्चुअल कीज़ सेटिंग में कॉन्फ़िगर करें।
    इतिहास और पूर्णता: Alt से कमांड इतिहास; टाइप करते समय ऑटो-पूर्णता।
    मॉनिटर: व्यू मेनू से प्रति-टर्मिनल CPU/मेमोरी देखें।
    खोज: Ctrl+F से टर्मिनल स्क्रॉलबैक खोजें।
    शॉर्टकट: सेटिंग्स → शॉर्टकट में सभी देखें और रिकॉर्ड करें।


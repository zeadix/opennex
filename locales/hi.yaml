about:
  menu_label: के बारे में
  title: OpenNex के बारे में
  version_label: संस्करण
  description: 'AI वर्कफ़्लो और कमांड लाइन के भारी उपयोगकर्ताओं के लिए मल्टी-विंडो स्टैकिंग टर्मिनल मैनेजर।


    टर्मिनल विंडो लेआउट को स्वतंत्र रूप से व्यवस्थित करें और टैब स्टैकिंग से अनगिनत सेशन प्रबंधित करें; लेआउट सहेजे और लोड किए जा सकते हैं। असीमित सेशन कमांड मेमोरी, ग्लोबल इंटरफ़ेस ज़ूम, कस्टम थीम, एन्क्रिप्टेड
    वर्कस्पेस और कस्टम शॉर्टकट — जटिल टर्मिनल वातावरण को एक जगह प्रबंधित करने के लिए सब कुछ।


    Rust में निर्मित: हाई-परफ़ॉर्मेंस इंजन 6000+ सक्रिय विंडो समानांतर में स्थिर रूप से चलाता है, Linux, Windows और macOS का नेटिव समर्थन करता है और 20+ भाषाएँ प्रदान करता है।

    बग मिला या सुझाव हैं? फ़ीडबैक का स्वागत है।'

about:
  menu_label: について
  title: OpenNex について
  version_label: バージョン
  description: 'AI ワークフローとコマンドラインヘビーユーザー向けのマルチウィンドウ積み上げ型ターミナルマネージャー。


    ターミナルウィンドウのレイアウトを自由に配置し、タブの積み上げで多数のセッションを管理。レイアウトの保存と読み込みに対応。無制限のセッションコマンド履歴、グローバルUIズーム、カスタムテーマ、ワークスペース暗号化、カスタムショートカットなどを内蔵し、複雑なターミナル環境を一元管理します。


    Rust で構築され、高性能エンジンは 6000+ のアクティブウィンドウを並行して安定稼働。Linux・Windows・macOS をネイティブサポートし、20+ 言語に対応しています。

    バグや改善のご提案はお気軽にお寄せください。'

about:
  menu_label: 정보
  title: OpenNex 정보
  version_label: 버전
  description: 'AI 워크플로와 명령줄 파워 유저를 위한 멀티윈도우 스태킹 터미널 매니저.


    터미널 창 레이아웃을 자유롭게 배치하고 탭 스태킹으로 수많은 세션을 관리하세요. 레이아웃 저장 및 불러오기를 지원합니다. 무제한 세션 명령 기억, 전역 인터페이스 확대/축소, 사용자 지정 테마, 작업공간 암호화, 사용자 지정 단축키 등을 내장해 복잡한 터미널 환경을 하나로 관리합니다.


    Rust로 구축되어 고성능 엔진이 6000+ 개의 활성 창을 안정적으로 병렬 실행합니다. Linux·Windows·macOS를 네이티브 지원하며 20+ 개 국어를 제공합니다.

    버그나 개선 제안이 있으시면 언제든 피드백을 보내주세요.'
  homepage_label: 홈페이지

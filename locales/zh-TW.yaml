about:
  menu_label: 關於
  title: 關於 OpenNex
  version_label: 版本
  description: '一款面向 AI 應用場景與命令列重度使用者的多視窗堆疊式終端管理器。


    支援自由排布終端視窗佈局、標籤堆疊管理大量工作階段，佈局可儲存與載入；內建無限工作階段命令記憶、全域介面縮放、自訂主題美化、工作區加密保護、自訂快捷鍵等能力，一站式管控複雜的終端執行環境。


    基於 Rust 建構，高效能引擎可穩定支撐 6000+ 活動視窗並行運行，原生跨平台支援 Linux、Windows、macOS，並提供 20+ 國際化語言。

    如在使用中遇到 Bug 或有功能優化建議，歡迎回饋。'

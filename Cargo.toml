[package]
name = "opennex"
version = "0.1.50"
edition = "2021"
description = "AI Terminal Manager"
license = "MIT"

[dependencies]
egui = "0.31"
eframe = "0.31"
egui_dock = { path = "egui_dock_local", features = ["serde"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
argon2 = "0.5"
ed25519-dalek = "2"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
egui-phosphor = "0.9"
dirs = "6.0.0"
ab_glyph = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
alacritty_terminal = "0.25"
egui_term = { path = "egui_term_local" }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
zip = "2"
qrcode = "0.14"
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
] }

[package.metadata.deb]
maintainer = "zeadix"
depends = "libc6 (>= 2.31), libgcc-s1"
assets = [
    ["target/release/opennex", "usr/bin/", "755"],
    ["assets/desktop/opennex.desktop", "usr/share/applications/", "644"],
]

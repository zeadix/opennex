[package]
name = "open-zoo"
version = "0.1.0"
edition = "2021"
description = "AI Terminal Manager"

[dependencies]
egui = "0.31"
eframe = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
egui-elegance = "0.13"
egui-phosphor = "0.9"
dirs = "6.0.0"
rusqlite = { version = "0.31", features = ["bundled"] }
alacritty_terminal = "0.25"
egui_term = { path = "egui_term_local" }
